name: Deploy

# Pull requests: verify the generated files and publish a preview deployment.
# Pushes to main: publish production. Needs repository secrets
# CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # sitemap lastmod reads git history
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # node:test and node:sqlite (the call-agent tests use an in-memory D1 shim)
      - name: Call-agent tests (Node)
        run: node --test tools/call-agent/test/*.test.mjs
      - name: Call-agent tests (Python)
        run: python3 -m unittest discover -s tools/call-agent -p 'test_*.py'
      - name: Call-agent knowledge pack is up to date
        run: |
          python3 tools/call-agent/build_pack.py --allow-missing-denylist
          git diff --exit-code functions/_lib/call-knowledge.generated.js
      - name: Unit tests
        run: python3 -m unittest tools/test_build_insights.py
      - name: Generated files are up to date
        run: python3 tools/build_insights.py --check
      - name: Discovery files (llms.txt, structured data, landmarks) are up to date
        run: python3 tools/build_discovery.py --check
      - name: Product pages are up to date
        run: python3 tools/build_product_pages.py --check
      - name: Repeated inline styles are in site.css, not in pages
        run: python3 tools/centralise_styles.py --lint

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Preview branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Branch names may contain characters that are unsafe in a command line.
          name="$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-60)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Stage publishable files
        run: tools/stage_site.sh "$RUNNER_TEMP/site"
      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Runs from the repo root so wrangler picks up ./functions.
          command: pages deploy ${{ runner.temp }}/site --project-name=arithim --branch=${{ steps.branch.outputs.name }} --commit-dirty=true
      - name: Comment preview URL
        uses: actions/github-script@v9.0.0
        env:
          BRANCH_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const url = process.env.BRANCH_URL || process.env.DEPLOY_URL;
            const body = `${marker}\nPreview deployed: ${url}\n\nThis deployment of this commit: ${process.env.DEPLOY_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Stage publishable files
        run: tools/stage_site.sh "$RUNNER_TEMP/site"
      - name: Deploy production
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name=arithim --branch=main --commit-dirty=true
