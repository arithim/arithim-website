<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar check illustration</title>
<style>
:root{--page:#f3f1ec;--ink:#1d2b45;--muted:#5b6577;--shadow:rgba(20,30,50,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#15171c;--ink:#eef1f7;--muted:#a3abba;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--page:#15171c;--ink:#eef1f7;--muted:#a3abba;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--page);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
figure{margin:0;width:100%;max-width:960px}
.stage{position:relative;aspect-ratio:16/9;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 18px 40px var(--shadow)}
.stage svg{display:block;width:100%;height:100%}
.stage text{font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
figcaption{margin-top:12px;text-align:center;font-size:14px;color:var(--muted)}

/* Static frame: the state shown with reduced motion, and the start state before any animation runs */
.sun{transform:translate(330px,120px)}
.moon,.night,.dusk,.stars,.glow,.puff,.shine,.check{opacity:0}
.verdict,.reason,.yield{opacity:1}
.hand{transform:scale(1)}
.eye{transform-box:fill-box;transform-origin:center}
.puff{transform-box:fill-box;transform-origin:center}
.hand{transform-box:fill-box;transform-origin:50% 100%}
.c1{transform:translateX(120px)}
.c2{transform:translateX(760px)}
.c3{transform:translateX(260px)}
.title{font-size:13px;font-weight:800;letter-spacing:2px;fill:#e8674a}
.big{font-size:22px;font-weight:800;fill:#1d2b45}
.ok{font-size:28px;font-weight:800;fill:#1f7a8c}
.reason text{font-size:16px;font-weight:600;fill:#1d2b45}
.yv{font-size:18px;font-weight:800;fill:#1d2b45}
.ys{font-size:13px;font-weight:600;fill:#5b4a1e}
.dot{fill:#1d2b45}

@media (prefers-reduced-motion: no-preference){
  .sun{animation:sunMove 12s ease-in-out infinite,sunFade 12s linear infinite}
  .rays{animation:spin 24s linear infinite}
  .eye{animation:blink 12s linear infinite}
  .hand{animation:hand 12s ease-in-out infinite}
  .moon{animation:moonMove 12s ease-in-out infinite,moonFade 12s linear infinite}
  .night,.stars,.glow{animation:nightish 12s linear infinite}
  .dusk{animation:duskFade 12s linear infinite}
  .stars circle{animation:twinkle 2.4s ease-in-out infinite alternate}
  .stars circle:nth-child(3n){animation-delay:-1.2s}
  .stars circle:nth-child(4n){animation-delay:-.6s}
  .c1{animation:drift 24s linear infinite}
  .c2{animation:drift 32s linear infinite -8s}
  .c3{animation:drift 40s linear infinite -20s}
  .s-far{animation:swayF 12s ease-in-out infinite}
  .s-mid{animation:swayM 12s ease-in-out infinite}
  .s-near{animation:swayN 12s ease-in-out infinite}
  .p1{animation:puff 12s ease-out infinite}
  .p2{animation:puff 12s ease-out infinite -6s}
  .shine{opacity:1;animation:shine 12s ease-in-out infinite}
  .check{animation:checkFade 12s linear infinite}
  .verdict{animation:verdictFade 12s linear infinite}
  .r1{animation:rA 12s linear infinite}
  .r2{animation:rB 12s linear infinite}
  .r3{animation:rC 12s linear infinite}
  .yield{animation:yF 12s linear infinite}
  .dot{animation:dotBlink 1.2s ease-in-out infinite}
  .d2{animation-delay:-.4s}
  .d3{animation-delay:-.8s}
  .paused,.paused *{animation-play-state:paused !important}
}

@keyframes sunMove{
  0%,100%{transform:translate(110px,300px)}
  12%{transform:translate(200px,190px)}
  25%{transform:translate(330px,120px)}
  37%{transform:translate(450px,150px)}
  50%{transform:translate(560px,300px)}
  56%{transform:translate(600px,400px)}
  94%{transform:translate(110px,300px)}}
@keyframes sunFade{0%,52%{opacity:1} 55%,96%{opacity:0} 99%,100%{opacity:1}}
@keyframes moonMove{
  0%,58%{transform:translate(110px,300px)}
  70%{transform:translate(200px,190px)}
  80%{transform:translate(330px,120px)}
  88%{transform:translate(450px,150px)}
  94%,100%{transform:translate(560px,300px)}}
@keyframes moonFade{0%,57%{opacity:0} 62%,92%{opacity:1} 96%,100%{opacity:0}}
@keyframes nightish{0%,52%{opacity:0} 64%,92%{opacity:1} 98%,100%{opacity:0}}
@keyframes duskFade{0%,43%{opacity:0} 50%,54%{opacity:1} 62%,88%{opacity:0} 92%,95%{opacity:1} 99%,100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)} 47%{transform:scaleY(.1)}}
@keyframes hand{0%,26%{transform:scale(0)} 31%{transform:scale(1.2)} 34%,94%{transform:scale(1)} 96%,100%{transform:scale(0)}}
@keyframes checkFade{0%,24%{opacity:1} 28%,95%{opacity:0} 100%{opacity:1}}
@keyframes verdictFade{0%,27%{opacity:0} 32%,92%{opacity:1} 96%,100%{opacity:0}}
@keyframes rA{0%,35%{opacity:0} 39%,92%{opacity:1} 96%,100%{opacity:0}}
@keyframes rB{0%,39%{opacity:0} 43%,92%{opacity:1} 96%,100%{opacity:0}}
@keyframes rC{0%,43%{opacity:0} 47%,92%{opacity:1} 96%,100%{opacity:0}}
@keyframes yF{0%,49%{opacity:0} 53%,92%{opacity:1} 96%,100%{opacity:0}}
@keyframes shine{0%,6%{transform:translateX(-120px)} 22%,100%{transform:translateX(120px)}}
@keyframes dotBlink{0%,100%{opacity:.2} 50%{opacity:1}}
@keyframes drift{from{transform:translateX(-220px)} to{transform:translateX(1100px)}}
@keyframes swayF{0%,100%{transform:translateX(0)} 50%{transform:translateX(-6px)}}
@keyframes swayM{0%,100%{transform:translateX(0)} 50%{transform:translateX(-12px)}}
@keyframes swayN{0%,100%{transform:translateX(0)} 50%{transform:translateX(-18px)}}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:0} 15%{opacity:.95} 100%{transform:translate(16px,-56px) scale(1.5);opacity:0}}
@keyframes twinkle{from{opacity:.35} to{opacity:1}}
</style>
</head>
<body>
<figure>
<div class="stage">
<svg id="scene" viewBox="0 0 960 540" role="img" aria-label="Animated paper-cut scene. A smiling sun checks a house roof, then gives a thumbs-up. Verdict: likely suitable for solar. Reasons: the roof faces the sun, no listed status found, outside the flood zone. Sample figure: about 3,400 kWh a year for a 4 kW system. Illustrative example, not real data." xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5ec8ee"/><stop offset=".55" stop-color="#bfeeff"/><stop offset="1" stop-color="#ffe7b5"/>
  </linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b4a9c"/><stop offset=".5" stop-color="#b35fa0"/><stop offset="1" stop-color="#ff9f6a"/>
  </linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111f4d"/><stop offset=".7" stop-color="#2a4b82"/><stop offset="1" stop-color="#3f6aa0"/>
  </linearGradient>
  <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="cells" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-43)">
    <rect width="16" height="16" fill="#1f3b5c"/><path d="M0 0H16M0 0V16" stroke="#7fb2d6" stroke-width="1.3" fill="none"/>
  </pattern>
  <clipPath id="slopeClip"><polygon points="398,352 470,286 470,350"/></clipPath>
  <filter id="cut" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0b2233" flood-opacity=".28"/>
  </filter>
</defs>

<!-- Sky, which changes with the time of day -->
<rect width="960" height="540" fill="url(#skyDay)"/>
<rect class="night" width="960" height="540" fill="url(#skyNight)"/>
<rect class="dusk" width="960" height="540" fill="url(#skyDusk)"/>

<g class="stars" fill="#fff">
  <circle cx="60" cy="60" r="2.2"/><circle cx="150" cy="40" r="1.6"/><circle cx="230" cy="96" r="2"/>
  <circle cx="300" cy="30" r="1.6"/><circle cx="520" cy="36" r="2"/><circle cx="600" cy="70" r="1.6"/>
  <circle cx="660" cy="40" r="2.2"/><circle cx="860" cy="60" r="1.6"/><circle cx="900" cy="130" r="2"/>
  <circle cx="40" cy="180" r="1.6"/><circle cx="190" cy="150" r="1.8"/><circle cx="470" cy="110" r="1.6"/>
  <circle cx="720" cy="120" r="1.8"/><circle cx="760" cy="30" r="1.6"/>
</g>

<!-- Sun, with a thumbs-up that appears when the verdict lands -->
<g class="sun" filter="url(#cut)">
  <g class="rays" fill="#ffb020">
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(0)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(30)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(60)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(90)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(120)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(150)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(180)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(210)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(240)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(270)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(300)"/>
    <rect x="-5" y="-66" width="10" height="20" rx="5" transform="rotate(330)"/>
  </g>
  <circle r="40" fill="#ffc83d"/>
  <g class="eye">
    <circle cx="-14" cy="-6" r="4.5" fill="#1d2b45"/><circle cx="14" cy="-6" r="4.5" fill="#1d2b45"/>
  </g>
  <circle cx="-22" cy="8" r="6" fill="#ff8a65" opacity=".8"/><circle cx="22" cy="8" r="6" fill="#ff8a65" opacity=".8"/>
  <path d="M-14 8 Q0 22 14 8" fill="none" stroke="#1d2b45" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(34 16)">
    <g class="hand">
      <rect x="0" y="8" width="28" height="22" rx="10" fill="#fff8ec" stroke="#1d2b45" stroke-width="3"/>
      <rect x="-2" y="-14" width="13" height="30" rx="6.5" fill="#fff8ec" stroke="#1d2b45" stroke-width="3"/>
    </g>
  </g>
</g>

<!-- Moon, which takes over at dusk -->
<g class="moon" filter="url(#cut)">
  <circle r="36" fill="#fff3c4"/>
  <circle cx="-16" cy="-18" r="5" fill="#f0d98c"/><circle cx="18" cy="14" r="7" fill="#f0d98c"/><circle cx="6" cy="-22" r="3.5" fill="#f0d98c"/>
  <path d="M-18 -4 Q-14 -1 -10 -4" stroke="#1d2b45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M10 -4 Q14 -1 18 -4" stroke="#1d2b45" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M-6 12 Q0 17 6 12" stroke="#1d2b45" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>

<!-- Drifting clouds -->
<g transform="translate(0 74)"><g class="c1"><g fill="#fff8ec"><circle cx="-30" cy="6" r="20"/><circle cx="0" cy="-6" r="28"/><circle cx="30" cy="6" r="20"/><rect x="-50" y="6" width="100" height="22" rx="11"/></g></g></g>
<g transform="translate(0 150) scale(.8)"><g class="c2"><g fill="#fff8ec"><circle cx="-30" cy="6" r="20"/><circle cx="0" cy="-6" r="28"/><circle cx="30" cy="6" r="20"/><rect x="-50" y="6" width="100" height="22" rx="11"/></g></g></g>
<g transform="translate(0 40) scale(.6)"><g class="c3"><g fill="#fff8ec"><circle cx="-30" cy="6" r="20"/><circle cx="0" cy="-6" r="28"/><circle cx="30" cy="6" r="20"/><rect x="-50" y="6" width="100" height="22" rx="11"/></g></g></g>

<!-- Far hills (parallax layer 1) -->
<g class="sway s-far" filter="url(#cut)">
  <path d="M-60 318 Q120 250 260 316 T520 300 T800 300 T1020 322 L1020 560 L-60 560Z" fill="#a8e6c8"/>
</g>

<!-- Mid hills (parallax layer 2) -->
<g class="sway s-mid" filter="url(#cut)">
  <path d="M-60 380 Q160 300 330 370 T640 356 T1020 372 L1020 560 L-60 560Z" fill="#6bc79a"/>
</g>

<!-- Near ground, house and trees (parallax layer 3) -->
<g class="sway s-near" filter="url(#cut)">
  <path d="M-60 440 Q200 404 380 428 Q470 438 560 426 Q760 404 1020 438 L1020 560 L-60 560Z" fill="#2a9d7a"/>
  <!-- trees -->
  <rect x="146" y="404" width="8" height="40" fill="#7a5a3c"/>
  <circle cx="150" cy="396" r="22" fill="#1d6e5a"/><circle cx="138" cy="406" r="14" fill="#1d6e5a"/>
  <rect x="246" y="418" width="8" height="26" fill="#7a5a3c"/>
  <circle cx="250" cy="412" r="16" fill="#1d6e5a"/>
  <!-- chimney, roof and walls -->
  <rect x="496" y="292" width="18" height="44" fill="#b5452f"/>
  <rect x="404" y="354" width="132" height="84" fill="#fff4e0"/>
  <polygon points="470,282 550,356 470,356" fill="#d4523a"/>
  <polygon points="390,356 470,282 470,356" fill="#e8674a"/>
  <!-- solar panels on the sun-facing slope, with a sun glint -->
  <polygon points="398,352 470,286 470,350" fill="url(#cells)"/>
  <g clip-path="url(#slopeClip)"><rect class="shine" x="380" y="270" width="60" height="110" fill="url(#shineG)"/></g>
  <!-- windows, with night glow -->
  <rect x="418" y="372" width="26" height="24" rx="4" fill="#9fd8ec"/>
  <rect class="glow" x="418" y="372" width="26" height="24" rx="4" fill="#ffd978"/>
  <rect x="429" y="372" width="3" height="24" fill="#fff4e0"/>
  <rect x="496" y="372" width="26" height="24" rx="4" fill="#9fd8ec"/>
  <rect class="glow" x="496" y="372" width="26" height="24" rx="4" fill="#ffd978"/>
  <rect x="507" y="372" width="3" height="24" fill="#fff4e0"/>
  <!-- door -->
  <rect x="456" y="392" width="28" height="46" rx="4" fill="#1f7a8c"/>
  <circle cx="478" cy="416" r="2.5" fill="#ffc83d"/>
  <!-- chimney smoke -->
  <circle class="puff p1" cx="504" cy="282" r="7" fill="#fff8ec"/>
  <circle class="puff p2" cx="504" cy="282" r="7" fill="#fff8ec"/>
</g>

<!-- Front grass, sign post and sample verdict sign -->
<path d="M-60 486 Q260 466 520 486 T1020 478 L1020 560 L-60 560Z" fill="#1d6e5a"/>
<rect x="774" y="430" width="12" height="76" rx="3" fill="#7a5a3c"/>

<g class="placard" filter="url(#cut)">
  <rect x="630" y="226" width="300" height="210" rx="16" fill="#fff7e6" stroke="#ecd9b0" stroke-width="2"/>
  <text x="654" y="252" class="title">SOLAR CHECK</text>

  <g class="check">
    <text x="654" y="292" class="big">Checking this roof</text>
    <circle class="dot d1" cx="892" cy="286" r="3.5"/>
    <circle class="dot d2" cx="904" cy="286" r="3.5"/>
    <circle class="dot d3" cx="916" cy="286" r="3.5"/>
  </g>

  <g class="verdict"><text x="654" y="292" class="ok">Likely suitable</text></g>

  <g class="reason r1">
    <circle cx="664" cy="325" r="7" fill="#4fb58e"/>
    <path d="M660 325 l3 3 l6 -6" stroke="#fff7e6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="330">Roof faces the sun</text>
  </g>
  <g class="reason r2">
    <circle cx="664" cy="347" r="7" fill="#4fb58e"/>
    <path d="M660 347 l3 3 l6 -6" stroke="#fff7e6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="352">No listed status found</text>
  </g>
  <g class="reason r3">
    <circle cx="664" cy="369" r="7" fill="#4fb58e"/>
    <path d="M660 369 l3 3 l6 -6" stroke="#fff7e6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="374">Outside the flood zone</text>
  </g>

  <g class="yield">
    <rect x="646" y="388" width="268" height="42" rx="10" fill="#ffd978"/>
    <text x="660" y="408" class="yv">About 3,400 kWh a year</text>
    <text x="660" y="424" class="ys">Sample figure for a 4 kW system</text>
  </g>
</g>
</svg>
</div>
<figcaption>Illustrative example. Not real data.</figcaption>
</figure>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var svg = document.getElementById('scene');
  var onScreen = true;
  var visible = !document.hidden;
  function apply() {
    svg.classList.toggle('paused', !(onScreen && visible));
  }
  document.addEventListener('visibilitychange', function () {
    visible = !document.hidden;
    apply();
  });
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      apply();
    }, { threshold: 0 });
    io.observe(stage);
  }
  apply();
})();
</script>
</body>
</html>
