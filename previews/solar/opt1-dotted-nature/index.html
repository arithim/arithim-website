<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar check hero, option 1</title>
<style>
:root {
  --page: #efeeea;
  --panel: #fbfbf9;
  --ink: #141414;
  --line: #dcdbd6;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0c0c0c;
    --panel: #161616;
    --ink: #ecebe6;
    --line: #2b2b2b;
  }
}
:root[data-theme="dark"] {
  --page: #0c0c0c;
  --panel: #161616;
  --ink: #ecebe6;
  --line: #2b2b2b;
}
html, body { margin: 0; background: var(--page); }
body {
  min-height: 100vh;
  box-sizing: border-box;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
}
figure { margin: 0; width: 100%; max-width: 960px; }
.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
figcaption { margin-top: 12px; font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
<figure>
  <div class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="Dotted animation: sunflowers turn towards a dotted sun while a small roof is checked. The sample verdict is likely suitable, with an estimated yield of about 3,400 kWh a year. Illustrative example, not real data."></canvas>
  </div>
  <figcaption>Illustrative example. Not real data.</figcaption>
</figure>
<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2, LOOP = 16000, STATIC_T = 11800;
  var SUN_A = 1200, SUN_B = 10500, VERDICT = 8200;
  var FONT = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
  // x as a share of the width, size, wind phase, bend
  var SPEC = [[0.085, 0.62, 0.0, -0.6], [0.2, 1.02, 1.1, 0.5], [0.31, 0.74, 2.3, -0.3], [0.42, 0.98, 0.6, 0.8], [0.13, 0.55, 3.4, 0.4], [0.26, 0.58, 4.6, -0.7], [0.5, 0.66, 1.9, -0.4]];

  var stage = document.getElementById('stage');
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var dark = window.matchMedia('(prefers-color-scheme: dark)');
  var cmp = false, W = 0, H = 0, y0 = 0, d = 3, dpr = 1, sprite = null, ink = '#141414', panel = '#fbfbf9';
  var master = 1, elapsed = 0, last = 0, raf = 0, seen = true;
  var plants = [], tufts = [], field = [], horizon = [], roof = [], house = [], geo = {};

  function ramp(t, a, b) { var x = (t - a) / (b - a); return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { return 1 - Math.pow(1 - x, 3); }
  function smooth(x) { return x * x * (3 - 2 * x); }
  function wrap(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
  function seeded(seed) { return function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
  function bz(u, ax, ay, bx, by, cx, cy) {
    var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return { x: a * ax + b * bx + c * cx, y: a * ay + b * by + c * cy };
  }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function readColours() {
    var cs = getComputedStyle(stage);
    ink = cs.getPropertyValue('--ink').trim() || '#141414';
    panel = cs.getPropertyValue('--panel').trim() || '#fbfbf9';
    sprite = document.createElement('canvas');
    sprite.width = sprite.height = 32;
    var g = sprite.getContext('2d');
    g.fillStyle = ink;
    g.beginPath(); g.arc(16, 16, 16, 0, TAU); g.fill();
  }

  // Dots every `step` px along a polyline. f is the share of the whole path at each dot, used to draw the path on.
  function polyDots(pts, step) {
    var segs = [], total = 0, out = [], acc = 0, i, j, a, b, len, n;
    for (i = 0; i < pts.length - 1; i++) {
      a = pts[i]; b = pts[i + 1];
      len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      segs.push([a, b, len]); total += len;
    }
    segs.forEach(function (s) {
      n = Math.max(1, Math.round(s[2] / step));
      for (j = 0; j < n; j++) {
        var f = j / n;
        out.push({ x: s[0][0] + (s[1][0] - s[0][0]) * f, y: s[0][1] + (s[1][1] - s[0][1]) * f, f: (acc + s[2] * f) / total });
      }
      acc += s[2];
    });
    return out;
  }

  function layout() {
    var r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * dpr));
    cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    d = Math.min(5, Math.max(2, H * 0.0075));
    cmp = H < 300;
    y0 = H * (cmp ? 0.86 : 0.74);
    buildScene();
  }

  function buildScene() {
    var rnd = seeded(11), i, k, z, sp, x, y, old = plants, xL, xR, ov, yB, yE, yA, xm, L, A, R, idx = 0, a, b, dw, dh;

    plants = SPEC.map(function (s, i) {
      return { x: W * s[0], s: s[1], by: y0 + H * (0.02 + (s[1] - 0.5) * 0.06), len: H * (cmp ? 0.2 : 0.3) * s[1], ph: s[2], bend: s[3], t0: 900 + i * 240, face: -Math.PI / 2,
        leaves: [{ at: 0.4, side: 1 }, { at: 0.62, side: -1 }] };
    }).sort(function (p, q) { return p.s - q.s; });
    plants.forEach(function (p, i) { if (old[i]) p.face = old[i].face; });

    // Field rows in perspective: rows spread further apart nearer the viewer, and fade in one by one.
    field = [];
    for (k = 0; k < 12; k++) {
      z = (k + 0.5) / 12;
      y = y0 + (H - y0) * Math.pow(z, 1.4) * 0.98 + H * 0.01;
      sp = W * (0.02 + 0.03 * z);
      for (x = (k % 2) * sp / 2; x < W + sp; x += sp) {
        field.push({ x: x, y: y, size: d * (0.6 + 0.5 * z), alpha: 0.12 + 0.2 * z, r0: 250 + k * 70, r1: 1000 + k * 70 });
      }
    }
    horizon = [];
    for (x = 0; x < W; x += d * 2.4) horizon.push({ x: x, y: y0 });

    tufts = [];
    for (i = 0; i < 34; i++) {
      z = rnd();
      tufts.push({ x: rnd() * W, y: y0 + H * 0.03 + z * H * 0.2, z: z, size: H * (0.03 + 0.035 * z), ph: rnd() * TAU, t0: 500 + i * 45 + rnd() * 200 });
    }

    // Small house on the right: outline, a dotted door, and a dot panel grid on the roof.
    xL = W * 0.665; xR = W * 0.845; ov = W * 0.012; yB = y0; yE = y0 - H * 0.15; yA = yE - H * 0.13; xm = (xL + xR) / 2;
    geo = { xL: xL, xR: xR, ov: ov, yB: yB, yE: yE, yA: yA, xm: xm };
    house = polyDots([[xL, yB], [xR, yB], [xR, yE], [xR + ov, yE], [xm, yA], [xL - ov, yE], [xL, yE], [xL, yB]], d * 2.2);
    dw = W * 0.03; dh = H * 0.09;
    house = house.concat(polyDots([[xm - dw, yB], [xm - dw, yB - dh], [xm + dw, yB - dh], [xm + dw, yB]], d * 2.2).map(function (p) {
      p.f = 0.85 + 0.15 * p.f; return p;
    }));

    L = [xL - ov, yE]; A = [xm, yA]; R = [xR + ov, yE];
    roof = [];
    for (i = 0; i < 5; i++) {
      for (k = 0; k < 3; k++) {
        a = 0.22 + i * 0.1; b = 0.1 + k * 0.1;
        if (a + b > 0.9) continue;
        roof.push({ x: L[0] * (1 - a - b) + A[0] * a + R[0] * b, y: L[1] * (1 - a - b) + A[1] * a + R[1] * b, t0: 5800 + idx * 70 });
        idx++;
      }
    }
  }

  // Sun crosses the upper sky from the middle of the horizon, peaks at the top right and sets behind the roof.
  function sunAt(t) {
    var u = ramp(t, SUN_A, SUN_B);
    return { x: W * (0.52 + 0.18 * u), y: y0 - H * (cmp ? 0.5 : 0.6) * Math.sin(Math.PI * u), on: ramp(t, 300, 1500) };
  }

  function dot(x, y, size, a) {
    if (a <= 0.01) return;
    ctx.globalAlpha = Math.min(1, a) * master;
    ctx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
  }

  function text(str, x, y, px, weight, alpha, ls) {
    if (alpha <= 0.01) return;
    ctx.font = weight + ' ' + px + 'px ' + FONT;
    ctx.fillStyle = ink;
    ctx.globalAlpha = Math.min(1, alpha) * master;
    if ('letterSpacing' in ctx) ctx.letterSpacing = (ls || 0) + 'px';
    ctx.fillText(str, x, y);
  }

  function drawSun(t, s) {
    var R = H * 0.072, k, i, th, rr, ang = t * 0.00005, a = s.on;
    if (a <= 0) return;
    var rings = [[1, 40, 0.9], [0.62, 22, 0.75], [0.3, 10, 0.6]];
    for (i = 0; i < rings.length; i++) {
      for (k = 0; k < rings[i][1]; k++) {
        th = k * TAU / rings[i][1] + i * 0.3;
        dot(s.x + Math.cos(th) * R * rings[i][0], s.y + Math.sin(th) * R * rings[i][0], d * rings[i][2], a);
      }
    }
    for (k = 0; k < 16; k++) {
      th = k * TAU / 16 + ang;
      for (i = 0; i < 2; i++) {
        rr = R * (1.35 + i * 0.28);
        dot(s.x + Math.cos(th) * rr, s.y + Math.sin(th) * rr, d * 0.7, a * 0.8);
      }
    }
  }

  function drawField(t) {
    var i, p;
    for (i = 0; i < horizon.length; i++) dot(horizon[i].x, horizon[i].y, d * 0.8, 0.55 * ramp(t, 80, 1100));
    for (i = 0; i < field.length; i++) {
      p = field[i];
      dot(p.x, p.y, p.size, p.alpha * ramp(t, p.r0, p.r1));
    }
  }

  // Grass tufts: three blades each, swaying in the wind.
  function drawTufts(t) {
    var i, p, b, f, k, a, bx, sway, tipX;
    for (i = 0; i < tufts.length; i++) {
      p = tufts[i];
      a = 0.55 * ramp(t, p.t0, p.t0 + 700);
      if (a <= 0) continue;
      sway = Math.sin(t * 0.0012 + p.ph) * p.size * 0.25;
      for (b = -1; b <= 1; b++) {
        bx = p.x + b * p.size * 0.35;
        for (k = 1; k <= 4; k++) {
          f = k / 4;
          tipX = bx + sway * f * f + b * p.size * 0.15 * f;
          dot(tipX, p.y - p.size * f * (1 - 0.15 * Math.abs(b)), d * 0.75, a);
        }
      }
    }
  }

  function drawHouse(t) {
    var prog = ease(ramp(t, 3600, 6200)), i, p, a;
    // Opaque silhouette in the panel colour, so the sun can set behind the house.
    if (prog > 0 && geo.xm) {
      ctx.globalAlpha = master;
      ctx.fillStyle = panel;
      ctx.beginPath();
      ctx.moveTo(geo.xL, geo.yB); ctx.lineTo(geo.xR, geo.yB); ctx.lineTo(geo.xR, geo.yE); ctx.lineTo(geo.xR + geo.ov, geo.yE);
      ctx.lineTo(geo.xm, geo.yA); ctx.lineTo(geo.xL - geo.ov, geo.yE); ctx.lineTo(geo.xL, geo.yE); ctx.closePath();
      ctx.fill();
    }
    if (prog > 0) for (i = 0; i < house.length; i++) { p = house[i]; if (p.f <= prog) dot(p.x, p.y, d, 0.8); }
    for (i = 0; i < roof.length; i++) { p = roof[i]; a = 0.7 * ramp(t, p.t0, p.t0 + 600); dot(p.x, p.y, d * 1.05, a); }
  }

  function headPos(p, t, g) {
    var sw = Math.sin(t * 0.0011 + p.ph) * H * 0.012 * p.s * g + Math.sin(t * 0.00037 + p.ph * 1.7) * H * 0.004 * p.s * g;
    return { x: p.x + sw, y: p.by - p.len * g };
  }

  function drawPlant(p, t, g, hd, face) {
    var cx = p.x + (hd.x - p.x) * 0.25 + p.bend * W * 0.012 * p.s, cy = (p.by + hd.y) / 2;
    var n = Math.max(6, Math.round(p.len / (d * 2.1))), i, u, q, k, L, lg, dir, len, nx, ny, f, bulge;
    var R = H * 0.046 * p.s + 2.5, hg = ease(ramp(g, 0.6, 1)), c, th, r, inner, outer, j;

    // Stem grows from the base up to the head.
    for (i = 0; i <= n; i++) {
      u = i / n;
      q = bz(u, p.x, p.by, cx, cy, hd.x, hd.y);
      dot(q.x, q.y, d * 0.85, (0.35 + 0.55 * u) * ramp(g, 0, 0.3));
    }

    // Two leaves, drawn as short dot curves.
    for (k = 0; k < p.leaves.length; k++) {
      L = p.leaves[k];
      lg = ramp(g, L.at, L.at + 0.35);
      if (lg <= 0) continue;
      q = bz(L.at, p.x, p.by, cx, cy, hd.x, hd.y);
      dir = -Math.PI / 2 + L.side * 0.85 + Math.sin(t * 0.001 + p.ph) * 0.05;
      len = p.len * 0.42 * lg;
      nx = -Math.sin(dir); ny = Math.cos(dir);
      for (j = 1; j <= 5; j++) {
        f = j / 5;
        bulge = Math.sin(Math.PI * f) * len * 0.2 * L.side;
        dot(q.x + Math.cos(dir) * len * f + nx * bulge, q.y + Math.sin(dir) * len * f + ny * bulge, d * 0.8, 0.6 * lg);
      }
    }

    if (hg <= 0) return;
    // Seed centre in a golden-angle spiral.
    for (k = 0; k < 24; k++) {
      r = R * 0.5 * Math.sqrt((k + 0.5) / 24); th = k * 2.39996;
      dot(hd.x + Math.cos(th) * r, hd.y + Math.sin(th) * r, d * 1.1, hg);
    }
    // Petals: rays that are longer and brighter on the side facing the sun.
    for (k = 0; k < 16; k++) {
      th = k * TAU / 16;
      c = (Math.cos(th - face) + 1) / 2;
      inner = R * 0.6; outer = R * (0.78 + 0.5 * c * c);
      for (j = 0; j < 3; j++) {
        r = inner + (outer - inner) * j / 2;
        dot(hd.x + Math.cos(th) * r, hd.y + Math.sin(th) * r, d * 0.9, (0.25 + 0.7 * c) * hg);
      }
    }
    // Dotted rim.
    for (k = 0; k < 40; k++) {
      th = k * TAU / 40;
      dot(hd.x + Math.cos(th) * R * 0.5, hd.y + Math.sin(th) * R * 0.5, d * 0.6, 0.25 * hg);
    }
  }

  // Verdict dot on the roof: a spinning dotted ring while checking, then a solid dot with pulses.
  function drawVerdict(t) {
    var vx = geo.xm, vy = geo.yA - H * 0.075, pend, fill, k, th, rr, ph, q, i, j, sp, n, lim;
    pend = ramp(t, 6200, 6800) * (1 - ramp(t, VERDICT, VERDICT + 300));
    for (k = 0; k < 16; k++) {
      th = k * TAU / 16 + t * 0.005;
      dot(vx + Math.cos(th) * H * 0.026, vy + Math.sin(th) * H * 0.026, d * 0.8, 0.6 * pend);
    }
    fill = ramp(t, VERDICT, VERDICT + 500);
    if (fill <= 0) return;
    rr = H * 0.0125 * ease(fill);
    ctx.globalAlpha = master;
    ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(vx, vy, rr, 0, TAU); ctx.fill();
    for (k = 0; k < 2; k++) {
      ph = (((t - VERDICT - 300 - k * 650) / 1300) % 1 + 1) % 1;
      rr = H * 0.02 + ph * H * 0.07;
      for (i = 0; i < 20; i++) {
        th = i * TAU / 20;
        dot(vx + Math.cos(th) * rr, vy + Math.sin(th) * rr, d * 0.7, (1 - ph) * 0.5 * fill);
      }
    }
  }

  // Text inside the scene, stacked top to bottom. All sample values are labelled as sample.
  function drawText(t) {
    var x0 = W * 0.05, top = Math.max(12, H * 0.065), tagPx = Math.max(9, H * 0.03), verPx = Math.max(14, H * 0.07),
      redPx = Math.max(10, H * 0.034), labPx = Math.max(9, H * 0.028), valPx = Math.max(16, H * 0.055);
    var tagY = top + tagPx, verY = tagY + verPx * 1.35, r1 = verY + redPx * 1.7, r2 = r1 + redPx * 1.35,
      labY = r2 + labPx * 2, valY = labY + valPx * 1.2;
    var checkA = ramp(t, 300, 900) * (1 - ramp(t, VERDICT, VERDICT + 400)),
      verdictA = ramp(t, VERDICT, VERDICT + 400),
      reasonsA = ramp(t, 9000, 9700),
      yieldA = ramp(t, 9500, 9800),
      kwh = Math.round(3400 * ease(ramp(t, 9700, 11300)));
    text('SAMPLE ADDRESS, NOT REAL DATA', x0, tagY, tagPx, 600, 0.55 * ramp(t, 200, 900), 1.2);
    text('Checking the roof and the site', x0, verY, verPx, 500, 0.55 * checkA);
    text('Likely suitable', x0, verY, verPx, 600, verdictA);
    text('Sample reasons: roof faces south.', x0, r1, redPx, 400, 0.8 * reasonsA);
    text('No listed building on record.', x0, r2, redPx, 400, 0.8 * reasonsA);
    text('ESTIMATED YIELD, SAMPLE', x0, labY, labPx, 600, 0.55 * yieldA, 1.2);
    text(fmt(kwh) + ' kWh a year', x0, valY, valPx, 600, yieldA);
  }

  function render(t, dt) {
    var s, i, p, g, hd, tgt;
    master = 1 - smooth(ramp(t, 14600, 15500));
    ctx.clearRect(0, 0, W, H);
    s = sunAt(t);
    drawSun(t, s);
    drawField(t);
    drawTufts(t);
    drawHouse(t);
    for (i = 0; i < plants.length; i++) {
      p = plants[i];
      g = ease(ramp(t, p.t0, p.t0 + 2600));
      hd = headPos(p, t, g);
      tgt = s.on > 0.5 ? Math.atan2(s.y - hd.y, s.x - hd.x) : -Math.PI / 2;
      if (dt > 0) p.face += wrap(tgt - p.face) * (1 - Math.exp(-dt * 0.0016));
      drawPlant(p, t, g, hd, p.face);
    }
    drawVerdict(t);
    drawText(t);
    ctx.globalAlpha = 1;
  }

  function running() { return seen && !document.hidden && !reduce.matches && stage.isConnected; }

  function frame(now) {
    raf = 0;
    if (!running()) return;
    var dt = last ? Math.min(now - last, 50) : 0;
    last = now;
    elapsed += dt;
    render(elapsed % LOOP, dt);
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (!raf && running()) { last = 0; raf = requestAnimationFrame(frame); }
  }

  function still() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    render(STATIC_T, 9000);
  }

  function redraw() {
    if (reduce.matches) still();
    else if (!running()) render(elapsed % LOOP, 0);
  }

  readColours();
  layout();
  if (reduce.matches) still(); else start();

  new ResizeObserver(function () { layout(); redraw(); }).observe(stage);
  new IntersectionObserver(function (e) { seen = e[0].isIntersecting; if (seen) start(); }, { threshold: 0 }).observe(stage);
  document.addEventListener('visibilitychange', start);
  reduce.addEventListener('change', function () { if (reduce.matches) still(); else start(); });
  dark.addEventListener('change', function () { readColours(); redraw(); });
})();
</script>
</body>
</html>
