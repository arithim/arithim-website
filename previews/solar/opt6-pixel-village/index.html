<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pixel village solar check</title>
<style>
:root{--bg:#f3f2ee;--ink:#1d2026;--muted:#5d6370;--line:#d9d6cc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15161b;--ink:#ebe9e3;--muted:#9da3ae;--line:#2c2f38}}
:root[data-theme="dark"]{--bg:#15161b;--ink:#ebe9e3;--muted:#9da3ae;--line:#2c2f38}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
figure{margin:0;width:min(960px,100%)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid var(--line);border-radius:4px;background:#1a1c2c}
figcaption{margin-top:10px;font-size:14px;color:var(--muted);text-align:center}
.verdict{width:min(960px,100%);margin:14px 0 0;font-size:15px;text-align:center}
</style>
</head>
<body>
<figure>
  <canvas id="scene" width="240" height="135" role="img" aria-label="Illustrative example, not real data. A pixel village street. A surveyor walks up to a house whose roof faces south and gets little shade. Six roof panels switch on one at a time. The sample scoreboard shows FITS and a sample yield of 3,850 kWh a year for a 3 kW system."></canvas>
  <figcaption>Illustrative example. Not real data.</figcaption>
</figure>
<p class="verdict">Sample verdict: fits. The roof faces south and gets little shade, so solar is likely to work at this address. Sample yield: about 3,850 kWh a year for a 3 kW system.</p>
<script>
(function () {
  'use strict';

  // Sweetie-16 palette. Sprite strings use one hex digit per pixel; '.' is transparent; 'p' is a roof panel slot.
  var PAL = ['#1a1c2c','#5d275d','#b13e53','#ef7d57','#ffcd75','#a7f070','#38b764','#257179',
             '#29366f','#3b5dc9','#41a6f6','#73eff7','#f4f4f4','#94b0c2','#566c86','#333c57'];
  var W = 240, H = 135, LOOP = 12;
  var cv = document.getElementById('scene');
  var ctx = cv.getContext('2d');
  var ID = [];
  for (var i = 0; i < 16; i++) ID.push(i);

  function remap(m) { var r = ID.slice(); for (var k in m) r[k] = m[k]; return r; }
  function pad(left, s) { return '.'.repeat(left) + s; }

  // Sprites
  var SURV_TOP = ['..4444..','.444444.','..3333..','..3003..','..3333..','..66666.','.36666cc','.36666dc','.36666cc','..88888.'];
  var SURV_STAND = SURV_TOP.concat(['..8888..','..8888..','..00.00.','..00.00.']);
  var SURV_STEP_A = SURV_TOP.concat(['..88.88.','..88.88.','.00..00.','.00..00.']);
  var SURV_STEP_B = SURV_TOP.concat(['.88..88.','.88..88.','..00.00.','..00.00.']);
  var SPARK_A = ['..4..','..4..','44c44','..4..','..4..'];
  var SPARK_B = ['.4.','4c4','.4.'];
  var CHECK = ['....5','...5.','5.5..','.5...'];
  var CLOUD = ['....cccc......','..cccccccc....','.cccccccccccc.','cccccccccccccc','dddddddddddddd'];
  var TREE = ['...5...','..565..','.56665.','5666665','.56665.','..565..','...3...','...3...'];
  var CAR = ['...99999...','.9bbbbbbb9.','99999999999','99999999999','.00.....00.'];
  var SUN = ['...333...','..34443..','.3c4443.','344444443','344444443','344444443','.3444443.','..34443..','...333...'];
  var HOUSE = [
    pad(13,'11'), pad(12,'1221'), pad(11,'122221'), pad(10,'1pppp221'), pad(9,'12pppp2221'),
    pad(8,'1pppp2pppp21'), pad(7,'12pppp2pppp221'), pad(6,'1pppp2pppp2pppp1'), pad(5,'12pppp2pppp2pppp21'),
    pad(4,'1' + '2'.repeat(18) + '1'),
    pad(3,'0' + '3'.repeat(20) + '0'),
    pad(3,'0' + '4'.repeat(20) + '0'),
    pad(3,'0' + '4'.repeat(20) + '0'),
    pad(3,'0' + '44cbbb44' + '4444' + '44cbbb44' + '0'),
    pad(3,'0' + '44bbbb44' + '4444' + '44bbbb44' + '0'),
    pad(3,'0' + '44bbbb44' + '4444' + '44bbbb44' + '0'),
    pad(3,'0' + '44333344' + '4444' + '44333344' + '0'),
    pad(3,'0' + '44444444' + '1111' + '44444444' + '0'),
    pad(3,'0' + '44444444' + '7777' + '44444444' + '0'),
    pad(3,'0' + '44444444' + '7777' + '44444444' + '0'),
    pad(3,'0' + '44444444' + '7777' + '44444444' + '0'),
    pad(3,'0' + '44444444' + '7777' + '44444444' + '0'),
    pad(3,'0' + '44444444' + '7777' + '44444444' + '0'),
    pad(3,'0'.repeat(22))
  ];

  var REMAP_A = remap({4:13, 3:14, 2:1});
  var REMAP_B = remap({4:12, 3:13, 2:3});

  // Roof panels in house-local pixels: [x, y, w, h], popped bottom row first.
  var PANELS = [[7,7,4,2],[12,7,4,2],[17,7,4,2],[9,5,4,2],[14,5,4,2],[11,3,4,2]];
  var POINTS = [642,642,642,642,641,641];
  var TX = 96, TY = 72;
  function popTime(k) { return 4.6 + k * 0.5; }

  // 3x5 pixel font, one string of 15 bits per glyph.
  var FONT = {
    A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
    E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
    I:'111010010010111', J:'001001001101010', K:'101110100110101', L:'100100100100111',
    M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
    Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
    U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
    Y:'101101010010010', Z:'111001010100111',
    '0':'111101101101111', '1':'010110010010111', '2':'110001010100111', '3':'110001010001110',
    '4':'101101111001001', '5':'111100110001110', '6':'011100110101010', '7':'111001010010010',
    '8':'010101010101010', '9':'010101011001110',
    '.':'000000000000010', ',':'000000000010100', ':':'000010000010000', '+':'000010111010000',
    '-':'000000111000000', '/':'001001010100100', ' ':'000000000000000'
  };

  function rect(x, y, w, h, c) { ctx.fillStyle = PAL[c]; ctx.fillRect(x, y, w, h); }

  function blit(rows, x, y, map) {
    for (var j = 0; j < rows.length; j++) {
      var row = rows[j];
      for (var i = 0; i < row.length; i++) {
        var ch = row.charAt(i);
        if (ch === '.') continue;
        var c = ch === 'p' ? 2 : parseInt(ch, 16);
        if (isNaN(c)) continue;
        if (map) c = map[c];
        rect(x + i, y + j, 1, 1, c);
      }
    }
  }

  function text(s, x, y, c, sc) {
    sc = sc || 1;
    var cx = x;
    for (var n = 0; n < s.length; n++) {
      var g = FONT[s.charAt(n)] || FONT[' '];
      for (var k = 0; k < 15; k++) {
        if (g.charAt(k) === '1') rect(cx + (k % 3) * sc, y + Math.floor(k / 3) * sc, sc, sc, c);
      }
      cx += 4 * sc;
    }
  }

  function outline(x, y, w, h, c) {
    rect(x, y, w, 1, c); rect(x, y + h - 1, w, 1, c);
    rect(x, y, 1, h, c); rect(x + w - 1, y, 1, h, c);
  }

  function sky() {
    rect(0, 0, W, 30, 10);
    rect(0, 30, W, 40, 11);
    for (var x = 0; x < W; x++) rect(x, 30, 1, 1, x % 2 ? 10 : 11);
  }

  function sun(t) {
    var p = t / LOOP;
    var x = 14 + 140 * p;
    var y = 58 - 46 * Math.sin(Math.PI * p);
    blit(SUN, Math.round(x) - 4, Math.round(y) - 4, null);
  }

  var CLOUDS = [[8, 12, 3], [110, 24, 4], [178, 38, 3]];
  function clouds(t) {
    for (var i = 0; i < CLOUDS.length; i++) {
      var c = CLOUDS[i];
      var x = ((c[0] + c[2] * t) % (W + 30)) - 20;
      blit(CLOUD, Math.round(x), c[1], null);
    }
  }

  function landscape() {
    for (var x = 0; x < W; x++) {
      var hy = 62 + Math.round(2 * Math.sin(x / 17) + 1.5 * Math.sin(x / 7 + 2));
      var ly = 83 + Math.round(Math.sin(x / 11));
      rect(x, hy, 1, ly - hy, 7);
      rect(x, ly, 1, 96 - ly, 6);
      for (var y = ly + 2; y < 96; y++) if ((x * 13 + y * 7) % 29 === 0) rect(x, y, 1, 1, 5);
    }
    rect(0, 96, W, 4, 13);
    rect(0, 100, W, 1, 15);
    rect(0, 101, W, H - 101, 14);
    for (var d = 0; d < W; d += 14) rect(d + 2, 122, 7, 1, 12);
  }

  function car(t) {
    var x = ((t * 20 + 40) % 260) - 22;
    blit(CAR, Math.round(x), 105, null);
  }

  function houses() {
    blit(TREE, 74, 76, null);
    // Compass sign beside the target house: a post with a board that reads S.
    rect(129, 84, 1, 11, 1);
    rect(125, 77, 9, 7, 0);
    rect(126, 78, 7, 5, 4);
    text('S', 127, 79, 0);
    blit(HOUSE, 8, 72, REMAP_A);
    blit(HOUSE, 150, 72, REMAP_B);
    blit(HOUSE, 196, 72, REMAP_A);
  }

  function targetHouse(t) {
    blit(HOUSE, TX, TY, null);
    for (var k = 0; k < PANELS.length; k++) {
      var p = PANELS[k], x = p[0], y = p[1], w = p[2], h = p[3];
      var ls = t - popTime(k);
      if (ls < 0) continue;
      rect(TX + x, TY + y, w, 1, 11);
      rect(TX + x, TY + y + 1, w, 1, 9);
      rect(TX + x, TY + y, 1, 1, 12);
      if (ls < 0.12) outline(TX + x - 1, TY + y - 1, w + 2, h + 2, 12);
      if (ls < 0.45) {
        var f = ls < 0.16 ? SPARK_A : (ls < 0.32 ? SPARK_B : null);
        if (f) {
          var cxp = TX + x + Math.floor(w / 2), cyp = TY + y + Math.floor(h / 2);
          var hw = Math.floor(f[0].length / 2), hh = Math.floor(f.length / 2);
          blit(f, cxp - hw, cyp - hh, null);
          blit(f, cxp + 4 - hw, cyp - 5 - hh, null);
        }
      }
    }
  }

  function surveyor(t) {
    var x, frame;
    var step = Math.floor(t * 5.5) % 2 ? SURV_STEP_A : SURV_STEP_B;
    if (t < 4) {
      x = -12 + (100 + 12) * (t / 4);
      frame = step;
    } else if (t < 9) {
      x = 100;
      frame = SURV_STAND;
    } else {
      x = 100 + (t - 9) * 60;
      frame = step;
    }
    blit(frame, Math.round(x), 82, null);
  }

  function reason(label, x, y, on) {
    text(label, x, y, on ? 12 : 13);
    if (on) blit(CHECK, x + 64, y - 1, null);
  }

  function board(t) {
    var x0 = 154, y0 = 4, w = 82, h = 66;
    rect(x0, y0, w, h, 0);
    rect(x0 + 1, y0 + 1, w - 2, h - 2, 15);
    rect(x0 + 1, y0 + 1, w - 2, 8, 2);
    text('SAMPLE', x0 + 3, y0 + 2, 12);

    var verdict = '----', vcol = 13;
    if (t >= 8) {
      verdict = 'FITS';
      vcol = (t < 8.8 && Math.floor((t - 8) * 8) % 2) ? 12 : 4;
    }
    text(verdict, x0 + 5, y0 + 12, vcol, 3);

    reason('SOUTH ROOF', x0 + 4, y0 + 31, t >= 5.2);
    reason('LITTLE SHADE', x0 + 4, y0 + 38, t >= 6.4);

    text('YIELD', x0 + 4, y0 + 46, 11);
    var pct = Math.min(1, Math.max(0, (t - 4.6) / 3.2));
    var val = pct >= 1 ? 3850 : Math.floor(pct * 77) * 50;
    var numStr = String(val).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    text(numStr, x0 + 5, y0 + 53, 4, 2);
    text('KWH/YR', x0 + 48, y0 + 58, 12);
  }

  function sparkleLayer(t) {
    // Floating points and sparkles are drawn above the house and surveyor, so they run after them.
    for (var k = 0; k < PANELS.length; k++) {
      var ls = t - popTime(k);
      if (ls < 0) continue;
      var p = PANELS[k];
      if (ls < 0.7) {
        var s = '+' + POINTS[k];
        var fx = TX + p[0] + Math.floor(p[2] / 2) - 8;
        var fy = TY - 6 - Math.floor(ls * 8);
        text(s, fx + 1, fy + 1, 0);
        text(s, fx, fy, 4);
      }
    }
  }

  function dissolve(t) {
    var c = 0;
    if (t < 0.5) c = 1 - t / 0.5;
    else if (t >= 11.3) c = Math.min(1, (t - 11.3) / 0.7);
    if (c <= 0) return;
    for (var by = 0; by < H; by += 6) {
      for (var bx = 0; bx < W; bx += 6) {
        var i = bx / 6, j = by / 6;
        var s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
        if (s - Math.floor(s) < c) rect(bx, by, 6, 6, 0);
      }
    }
  }

  function draw(t) {
    sky();
    sun(t);
    clouds(t);
    landscape();
    houses();
    targetHouse(t);
    car(t);
    surveyor(t);
    sparkleLayer(t);
    board(t);
    dissolve(t);
  }

  // Playback: loops, pauses off screen or hidden, static frame for reduced motion.
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var q = parseFloat(new URLSearchParams(location.search).get('t'));
  var frozen = isFinite(q) ? q : null;
  var STATIC_T = 8.6;
  var visible = true, raf = 0, last = 0, t = 0;

  function running() {
    return frozen === null && visible && !document.hidden && !reduce.matches;
  }

  function frame(now) {
    raf = 0;
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    t = (t + dt) % LOOP;
    draw(t);
    if (running()) raf = requestAnimationFrame(frame);
    else last = 0;
  }

  function sync() {
    if (running()) {
      if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
    } else {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      draw(frozen !== null ? frozen : (reduce.matches ? STATIC_T : t));
    }
  }

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      sync();
    }).observe(cv);
  }
  document.addEventListener('visibilitychange', sync);
  if (reduce.addEventListener) reduce.addEventListener('change', sync);
  else if (reduce.addListener) reduce.addListener(sync);

  sync();
})();
</script>
</body>
</html>
