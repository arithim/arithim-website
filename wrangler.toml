# Cloudflare Pages configuration for arithim.com.
# Secrets (RESEND_API_KEY, TURNSTILE_SECRET, TO_EMAIL, FROM_EMAIL and the CALL_* secrets)
# are set on the Pages project and are not defined here. See tools/call-agent/docs/wrangler-plan.md.
name = "arithim"
pages_build_output_dir = "."
compatibility_date = "2026-09-10"

[vars]
CALL_ENV = "prod"
CALL_TALKER_MODEL = "claude-sonnet-5-5"
CALL_THINKER_MODEL = "claude-opus-5-5"

[[d1_databases]]
binding = "CALLS_DB"
database_name = "arithim-calls"
database_id = "24516a88-0b76-404c-b4d5-fede7b4da240"
migrations_dir = "migrations"

[env.preview.vars]
CALL_ENV = "preview"
CALL_TALKER_MODEL = "claude-sonnet-5-5"
CALL_THINKER_MODEL = "claude-opus-5-5"

[[env.preview.d1_databases]]
binding = "CALLS_DB"
database_name = "arithim-calls-preview"
database_id = "87a41853-bd99-4cad-b3b5-32e58dc3536c"
migrations_dir = "migrations"
